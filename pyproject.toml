[project]
name = "kpn-mcp"
version = "0.1.0"
description = "KPN MCP server for the MSPbots Agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "MSPbots.ai" }]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "uvicorn>=0.30,<1.0",
    "starlette>=0.38,<1.0",
]

[project.scripts]
kpn-mcp = "kpn_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpn_mcp"]
