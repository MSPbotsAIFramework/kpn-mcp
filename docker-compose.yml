# Local debug only. Credentials are never set here -- pass them per request
# as headers (see README's "Authentication headers" table), not as
# container environment variables.
services:
  kpn-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
